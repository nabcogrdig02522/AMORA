        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned iOS app bundle
        run: |
          cd build/ios/iphoneos
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/amora-ios-unsigned-app.zip" Runner.app

      - name: Upload unsigned iOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: amora-ios-unsigned-app
          path: amora-ios-unsigned-app.zip
          if-no-files-found: error
          retention-days: 14
