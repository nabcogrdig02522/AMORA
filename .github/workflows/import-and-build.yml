          SUPABASE_URL: https://nauelfmujzzodqqejqpv.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_XTaNom4pKroqKwSQY6RyDQ_1JbOWivg
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Supabase URL is missing."; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "::error::SUPABASE_ANON_KEY repository secret is missing; refusing to build a disconnected app."; exit 1; }
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env

      - name: Generate iOS project
        run: flutter create --platforms=ios --org com.amora.app --project-name amora .

      - name: Add iOS media privacy descriptions
        shell: bash
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p = Path("ios/Runner/Info.plist")
          data = plistlib.loads(p.read_bytes())
          data.update({
            "NSCameraUsageDescription": "AMORA uses your camera when you choose to take a profile photo or share a Moment.",
            "NSPhotoLibraryUsageDescription": "AMORA needs photo library access so you can select profile photos and Moments.",
            "NSPhotoLibraryAddUsageDescription": "AMORA can save media you choose to keep on your device.",
            "NSMicrophoneUsageDescription": "AMORA uses your microphone only when you choose a voice or video feature.",
          })
          p.write_bytes(plistlib.dumps(data))
          PY

      - name: Replace generated counter test with AMORA smoke test
        run: |
          mkdir -p test
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
