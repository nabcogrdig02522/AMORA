name: Build AMORA Android and iOS QA apps
on:
  push:
    paths:
      - "AMORA_Final_Release_Candidate_Fixed.zip"
      - "AMORA_Litgo_Integration_Sprint3.zip"
      - ".github/workflows/import-and-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android QA APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract AMORA source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ARCHIVE="AMORA_Litgo_Integration_Sprint3.zip"
          test -f "$SOURCE_ARCHIVE" || { echo "::error::Sprint 3 source archive is required; refusing to build the incomplete baseline app."; exit 1; }
          echo "AMORA_SOURCE_VARIANT=litgo-sprint3" >> "$GITHUB_ENV"
          unzip -q "$SOURCE_ARCHIVE" -d /tmp/amora-import
          cp -a /tmp/amora-import/AMORA_Final_Release_Candidate/. .
          rm -rf /tmp/amora-import
          # Patch the imported Sprint 3 auth screen, not the inactive repository root.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/screens/auth_screen.dart")
          s = p.read_text()
          import_line = "import 'package:supabase_flutter/supabase_flutter.dart';"
          app_import = "import 'screens/app_shell.dart';"
          if app_import not in s:
              if import_line not in s:
                  raise SystemExit("Supabase import not found; refusing auth patch.")
              s = s.replace(import_line, import_line + "\\n" + app_import, 1)
          old = """        await auth.signUp(
          email: email.text.trim(),
          password: password.text,
          data: {
            'display_name': displayName.text.trim(),
            'date_of_birth': '${dob.year.toString().padLeft(4, '0')}-${dob.month.toString().padLeft(2, '0')}-${dob.day.toString().padLeft(2, '0')}',
            'gender': 'Prefer to discuss',
          },
        );
        message = 'Account created. Check your email if confirmation is enabled, then sign in.';
        creatingAccount = false;"""
          new = """        final response = await auth.signUp(
          email: email.text.trim(),
          password: password.text,
          data: {
            'display_name': displayName.text.trim(),
            'date_of_birth': '${dob.year.toString().padLeft(4, '0')}-${dob.month.toString().padLeft(2, '0')}-${dob.day.toString().padLeft(2, '0')}',
            'gender': 'Prefer to discuss',
          },
        );
        if (response.session != null && mounted) {
          Navigator.of(context).pushAndRemoveUntil(
            MaterialPageRoute(builder: (_) => const AppShell()),
            (route) => false,
          );
          return;
        }
        message = 'Account created, but no sign-in session was returned. Email confirmation may still be enabled in Supabase.';
        creatingAccount = false;"""
          if old not in s:
              raise SystemExit("Expected sign-up handler not found; refusing to patch an unexpected source version.")
          s = s.replace(old, new, 1)
          p.write_text(s)
          if "response.session != null" not in s or "const AppShell()" not in s:
              raise SystemExit("Direct-entry auth patch verification failed.")
          print("Verified: sign-up routes directly to AppShell when Supabase returns a session.")
          PY
          echo "--- AUTH SOURCE FOR REGISTRATION PATCH REVIEW ---"
          sed -n '1,240p' lib/screens/auth_screen.dart
          echo "--- END AUTH SOURCE ---"
          echo "--- MAIN SOURCE ---"
          sed -n "1,260p" lib/main.dart
          echo "--- END MAIN SOURCE ---"
          echo "--- AUTH REFERENCES ---"
          grep -R -n -E "AuthScreen|onAuthStateChange|currentSession|AppShell|Navigator" lib/main.dart lib/screens/app_shell.dart lib 2>/dev/null | head -160 || true
          echo "--- END AUTH REFERENCES ---"
          echo "Building source archive: $SOURCE_ARCHIVE"
          if [ "$SOURCE_ARCHIVE" = "AMORA_Litgo_Integration_Sprint3.zip" ]; then
            for migration in 20261201_social_engagement.sql 20261202_moments_media_interactions.sql 20261203_virtual_gifts_leaderboard.sql; do
              test -f "supabase/migrations/$migration" || { echo "::error::Missing Sprint 3 migration: $migration"; exit 1; }
            done
            grep -q "SocialHubScreen" lib/screens/app_shell.dart
            grep -q "GiftEconomyScreen" lib/screens/app_shell.dart
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Configure Supabase environment
        env:
          SUPABASE_URL: https://nauelfmujzzodqqejqpv.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_XTaNom4pKroqKwSQY6RyDQ_1JbOWivg
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Supabase URL is missing."; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "::error::SUPABASE_ANON_KEY repository secret is missing; refusing to build a disconnected app."; exit 1; }
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env

      - name: Generate Android project
        run: flutter create --platforms=android --org com.amora.app --project-name amora .

      - name: Add Android runtime permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
            "android.permission.INTERNET",
            "android.permission.CAMERA",
            "android.permission.RECORD_AUDIO",
            "android.permission.READ_MEDIA_IMAGES",
            "android.permission.READ_MEDIA_VIDEO",
            "android.permission.POST_NOTIFICATIONS",
          ]
          missing = [x for x in permissions if f'name="{x}"' not in s]
          block = "".join(f'    <uses-permission android:name="{x}" />\\n' for x in missing)
          s = s.replace("<application", block + "    <application", 1)
          p.write_text(s)
          PY

      - name: Repair gift leaderboard Dart syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("lib/screens/gift_economy_screen.dart")
          s = p.read_text()
          pattern = r"          return Card\(child:Column\(children:List\.generate\(rows\.length,\(i\)\{.*?          \}\)\)\),"
          replacement = """          return Card(
            child: Column(
              children: [
                for (var i = 0; i < rows.length; i++)
                  ListTile(
                    leading: CircleAvatar(
                      backgroundImage: (rows[i]['photo_url']?.toString() ?? '').startsWith('http')
                          ? NetworkImage(rows[i]['photo_url'].toString())
                          : null,
                      child: (rows[i]['photo_url']?.toString() ?? '').startsWith('http')
                          ? null
                          : Text('${i + 1}'),
                    ),
                    title: Text('${rows[i]['display_name']}', style: const TextStyle(fontWeight: FontWeight.w600)),
                    subtitle: Text('${rows[i]['gifts_received']} gifts received'),
                    trailing: Text(
                      '${rows[i]['points_received']} pts',
                      style: const TextStyle(fontWeight: FontWeight.bold, color: Color(0xFF7B2348)),
                    ),
                  ),
              ],
            ),
          );"""
          updated, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not locate the malformed gift leaderboard widget; refusing to continue.")
          p.write_text(updated)
          PY
          dart format lib/screens/gift_economy_screen.dart

      - name: Install dependencies and run checks
        run: |
          flutter pub get
          mkdir -p test
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:amora/main.dart';
          void main() {
            testWidgets('AMORA setup screen renders', (WidgetTester tester) async {
              await tester.pumpWidget(const AmoraApp(configured: false));
              expect(find.text('Welcome to AMORA'), findsOneWidget);
            });
          }
          EOF
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Disable unstable Android Lint tasks in dependencies
        shell: bash
        run: |
          cat >> android/build.gradle <<'EOF'

          // Work around Android Gradle Lint's upstream NoSuchMethodError in
          // image_picker_android on the hosted build image. Flutter analyze/tests
          // still run; this disables only Gradle lint tasks.
          allprojects {
            tasks.configureEach {
              if (name.toLowerCase().contains("lint")) {
                enabled = false
              }
            }
          }
          EOF

      - name: Build QA APK through Gradle
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon :app:assembleRelease
          cd ..
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            APK_PATH="$(find android -type f -path '*/outputs/apk/release/*.apk' | head -n 1)"
          fi
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Gradle completed but no release APK was found in the Android module."
            find android -type f -name '*.apk' -print
            exit 1
          fi
          mkdir -p build/app/outputs/flutter-apk
          cp "$APK_PATH" build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: amora-android-qa-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

